# Added in the vmalyshev1/open-sales-tax fork (not part of upstream OpenSalesTax).
#
# Weekly upstream sync with a safety check.
#
#   1. Fetches ejosterberg/open-sales-tax (upstream) main.
#   2. If it has commits this fork's main lacks, merges them into the
#      `upstream-sync` branch (never directly into main).
#   3. Runs the test suite against PostgreSQL on that branch.
#   4. Opens (or updates) a pull request into main with the test result.
#      Nothing reaches main until a human merges the PR.
#   5. If the merge conflicts with this fork's own changes, opens an issue
#      instead of a PR.
#
# Tests run inside this job because pull requests opened with GITHUB_TOKEN
# do not trigger other workflows (such as ci.yml).
#
# One-time repository settings required:
#   - Actions tab: enable workflows for this fork.
#   - Settings > Actions > General > Workflow permissions:
#     tick "Allow GitHub Actions to create and approve pull requests".

name: Upstream sync

on:
  schedule:
    # Mondays 06:17 UTC (off the hour to avoid scheduler congestion).
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

env:
  UPSTREAM_URL: https://github.com/ejosterberg/open-sales-tax.git
  UPSTREAM_BRANCH: main
  SYNC_BRANCH: upstream-sync
  POETRY_VERSION: "1.8.4"
  PYTHON_VERSION: "3.11"

jobs:
  sync:
    name: Merge upstream, test, open PR
    # Never run in upstream itself if this file is ever contributed back.
    if: github.repository == 'vmalyshev1/open-sales-tax'
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: opensalestax
          POSTGRES_PASSWORD: opensalestax
          POSTGRES_DB: opensalestax
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U opensalestax"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out this fork's main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch upstream and count new commits
        id: check
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "$UPSTREAM_URL"
          git fetch --no-tags upstream "$UPSTREAM_BRANCH"
          behind=$(git rev-list --count "HEAD..upstream/$UPSTREAM_BRANCH")
          echo "behind=$behind" >> "$GITHUB_OUTPUT"
          echo "upstream_sha=$(git rev-parse --short "upstream/$UPSTREAM_BRANCH")" >> "$GITHUB_OUTPUT"
          echo "Fork main is $behind commit(s) behind upstream."

      - name: Merge upstream into the sync branch
        id: merge
        if: steps.check.outputs.behind != '0'
        run: |
          git checkout -B "$SYNC_BRANCH"
          if git merge --no-edit --no-ff "upstream/$UPSTREAM_BRANCH" \
               -m "Merge upstream ${UPSTREAM_BRANCH} (${{ steps.check.outputs.upstream_sha }})"; then
            echo "conflict=false" >> "$GITHUB_OUTPUT"
          else
            git diff --name-only --diff-filter=U > /tmp/conflicts.txt
            git merge --abort
            echo "conflict=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Report merge conflict as an issue
        if: steps.merge.outputs.conflict == 'true'
        run: |
          title="Upstream sync: merge conflict (upstream ${{ steps.check.outputs.upstream_sha }})"
          {
            echo "Upstream has ${{ steps.check.outputs.behind }} new commit(s), but they conflict with this fork's changes."
            echo
            echo "Conflicting files:"
            echo '```'
            cat /tmp/conflicts.txt
            echo '```'
            echo
            echo "Resolve by merging \`upstream/main\` into a branch by hand. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } > /tmp/issue.md
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title Upstream sync: merge conflict" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment --repo "$GITHUB_REPOSITORY" "$existing" --body-file /tmp/issue.md
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file /tmp/issue.md
          fi

      - name: Set up Python
        if: steps.merge.outputs.conflict == 'false'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        if: steps.merge.outputs.conflict == 'false'
        run: |
          pipx install "poetry==${POETRY_VERSION}"
          poetry install --no-interaction --no-ansi

      - name: Run tests (PostgreSQL)
        id: tests
        if: steps.merge.outputs.conflict == 'false'
        continue-on-error: true
        env:
          OPENSALESTAX_DATABASE_URL: postgresql+asyncpg://opensalestax:opensalestax@localhost:5432/opensalestax
        run: |
          set -o pipefail
          poetry run pytest -q -m "not liveapi" 2>&1 | tee /tmp/pytest.log

      - name: Push sync branch and open or update the pull request
        if: steps.merge.outputs.conflict == 'false'
        run: |
          git push --force origin "$SYNC_BRANCH"

          if [ "${{ steps.tests.outcome }}" = "success" ]; then
            result="PASSED"
          else
            result="FAILED - review before merging"
          fi
          summary=$(tail -n 5 /tmp/pytest.log)

          {
            echo "Automated weekly sync from [ejosterberg/open-sales-tax](https://github.com/ejosterberg/open-sales-tax)."
            echo
            echo "- New upstream commits: **${{ steps.check.outputs.behind }}** (upstream main at \`${{ steps.check.outputs.upstream_sha }}\`)"
            echo "- Tests (PostgreSQL): **$result**"
            echo
            echo '```'
            echo "$summary"
            echo '```'
            echo
            echo "Upstream changes: ${{ github.server_url }}/${{ github.repository }}/compare/main...${SYNC_BRANCH}"
            echo "Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            echo "Merging this PR updates this fork's main only. The US-Sales-Tax-Calc app keeps its pinned version until it is bumped deliberately."
          } > /tmp/pr.md

          title="Upstream sync: ${{ steps.check.outputs.behind }} new commit(s), tests $result"
          existing=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$SYNC_BRANCH" --base main --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh pr edit --repo "$GITHUB_REPOSITORY" "$existing" --title "$title" --body-file /tmp/pr.md
          else
            gh pr create --repo "$GITHUB_REPOSITORY" --head "$SYNC_BRANCH" --base main --title "$title" --body-file /tmp/pr.md
          fi

      - name: Nothing to do
        if: steps.check.outputs.behind == '0'
        run: echo "Fork main already contains everything from upstream."
